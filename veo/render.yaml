# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ui-test-runner
    env: docker
    rootDir: veo                     # Root directory when repo has veo/ folder at root
    dockerfilePath: Dockerfile
    plan: starter                    # Starter plan or higher recommended for Puppeteer
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_DEFINED_URL
        value: https://labs.google/fx/tools/flow
      - key: FIRESTORE_SESSION_POOL_COLLECTION
        value: pool_cookies
      - key: CHROME_EXECUTABLE
        value: /usr/bin/google-chrome
